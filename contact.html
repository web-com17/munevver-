<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munevver Mobilya</title>
    <link rel="stylesheet" href="styles.css">

    <style>
 .container {
        max-width: 800px;
        margin: 150px auto;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        padding: 20px;
    }

    h1 {
        text-align: center;
        color: #8e2e2e;
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin: 15px 0 5px;
        font-weight: bold;
    }

    .iput-contant, textarea, .button-conract {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 16px;
    }

    .iput-contant:focus, textarea:focus {
        border-color: #440303;
        outline: none;
    }

    .button-conract {
        background-color: #752222;
        color: #fff;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background-color: #8e2e2e;
        box-shadow: 0 0 30px #944242;;
    }


</style>

</head>


<body>
    <header>
        <div class="logo">
            <img src="logoo.png" alt="Munevver Mobilya Logo">
        </div>        
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="Services.html">Services</a></li>
                <li><a href="aboutUs.html">About us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <button class="login-btn">Login</button>
    </header>

    <div class="container">
        <h1> Contact us </h1>
        <form>
            <label for="name"> Name </label>
            <input class="iput-contant" type="text" id="name" placeholder="Enter your full name">

            <label for="email"> Gmail </label>
            <input class="iput-contant" type="email" id="email" placeholder="Enter your email">

            <label for="message"> Message </label>
            <textarea id="message" rows="5" placeholder="Enter your message"></textarea>

            <button class="button-conract" type="submit"> Send </button>
        </form>
    </div>
